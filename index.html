<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13263b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="ໃຫ້ Spider-Man ພາໄປງານວັນເກີດຂອງນ້ອງມະຫາໂຊກ.">
  <title>Spider-Man ພາໄປງານ · ວັນເກີດມະຫາໂຊກ</title>
  <link rel="icon" href="assets/mask.svg" type="image/svg+xml">
  <link rel="preload" href="assets/cover.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="assets/phi.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="style.css?v=motion-button">
</head>
<body>
  <svg aria-hidden="true" class="symbols" xmlns="http://www.w3.org/2000/svg">
    <symbol id="pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="direction" viewBox="0 0 24 24"><path d="m12 2 10 10-10 10L2 12z"/><path d="M8.5 15v-4h6m-1.8-2L15 11l-2.3 2"/></symbol>
    <symbol id="replay" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1.3 7.4M4 4v6h6"/></symbol>
  </svg>
  <div class="shell">
    <header class="masthead">
      <div class="brand"><img src="assets/mask.svg" alt="" width="34" height="39"><span lang="en">MAHASOK <b>BIRTHDAY</b></span></div>
      <a class="map-link" href="https://maps.app.goo.gl/yUSR7DZM5DNzTeFH8"><svg aria-hidden="true"><use href="#pin"/></svg>ເບິ່ງໝຸດງານ</a>
    </header>
    <main>
      <div class="lead">
        <section class="guidance" aria-labelledby="guide-title">
          <h2 id="guide-title">ລູກສອນນຳທາງໄປງານ</h2>
          <div id="arrow-stage" class="arrow-stage" data-state="waiting">
            <svg viewBox="-100 -100 200 200" focusable="false" aria-hidden="true">
              <g id="route-arrow" transform="rotate(32)">
                <path class="arrow-shape" d="M0-85 70-8 30-14 30 68-30 68-30-14-70-8Z"/>
                <path class="arrow-facet" d="M0-79 64-12 26-18 26 64 4 64 4-27Z"/>
                <path class="arrow-shine" d="m-48-17 38-42"/>
              </g>
              <path class="arrival-mark" d="m-61 3 39 39 82-85"/>
            </svg>
            <button id="enable-heading" type="button" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="4" width="8" height="16" rx="2" transform="rotate(15 12 12)"/><path d="M2 12a10 10 0 0 1 4-8M2 6v6h4m16 0a10 10 0 0 1-4 8m4-2v-6h-4"/></svg>
              <span>
                <strong>ແຕະເພື່ອໃຫ້ລູກສອນໝຸນ</strong>
                <small>ແລ້ວເລືອກ ອະນຸຍາດ (<span lang="en">Allow</span>)</small>
              </span>
            </button>
          </div>
          <div class="guide-reading" role="status" aria-atomic="true">
            <p id="location-status">ເປີດ Google Maps ເພື່ອໄປງານ.</p>
            <div id="route-reading" hidden>
              <p id="distance"></p>
              <p id="bearing"></p>
            </div>
          </div>
          <p id="route-mode" role="status" hidden></p>
          <a id="directions" class="primary" href="https://www.google.com/maps/dir/?api=1&amp;destination=17.9152293%2C102.637614&amp;dir_action=navigate"><svg aria-hidden="true"><use href="#direction"/></svg>ນຳທາງດ້ວຍ Google Maps</a>
        </section>
        <div class="cover" role="group" aria-label="Spider-Man ໂຫນໃຍຂ້າມເມືອງມາຮັບແຂກ">
          <div class="lettering">
            <p class="kicker">ໂຫນໃຍໄປນຳ</p>
            <div class="cover-title" lang="en" aria-label="Spider-Man"><span aria-hidden="true">SPIDER-</span><span aria-hidden="true">MAN</span></div>
          </div>
          <img class="hero" src="assets/spider-man-comic-swing.svg" width="660" height="809" alt="">
          <button type="button" id="replay-button" class="replay" aria-label="ເບິ່ງ Spider-Man ໂຫນໃຍອີກຄັ້ງ" title="ເບິ່ງອີກຄັ້ງ" hidden><svg aria-hidden="true"><use href="#replay"/></svg></button>
        </div>
      </div>
      <section class="invitation" aria-labelledby="event-title">
        <div class="copy">
          <p class="greeting"><span aria-hidden="true"></span>ບັດເຊີນວັນເກີດ</p>
          <h1 id="event-title">ວັນເກີດນ້ອງ<span>ມະຫາໂຊກ</span></h1>
          <p class="message">ມາເປົ່າທຽນນຳກັນເດີ! ໃຫ້ Spider-Man ພາເຈົ້າໄປບ່ອນຈັດງານ.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js?v=motion-button" defer></script>
</body>
</html>
