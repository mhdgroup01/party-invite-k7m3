<!doctype html>
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#13263b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>ເມນູອາຫານ · ວັນເກີດນ້ອງມະຫາໂຊກ</title>
  <link rel="icon" href="assets/mask.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/phi.css">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="style.css?v=food-menu">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <main class="shell menu-shell">
    <nav class="menu-nav" aria-label="ເມນູຫຼັກ">
      <a class="map-link" href="./"><span aria-hidden="true">‹</span> ກັບໄປບັດເຊີນ</a>
    </nav>
    <article class="menu-sheet" aria-labelledby="menu-title">
      <header class="menu-heading">
        <div>
          <p>ວັນເກີດນ້ອງມະຫາໂຊກ</p>
          <h1 id="menu-title">ເມນູອາຫານ</h1>
        </div>
        <img src="assets/mask.svg" width="62" height="72" alt="">
      </header>
      <div class="dishes">
          <figure class="featured-dish">
            <img src="assets/menu/grilled-prawns.webp" width="1050" height="700" alt="" fetchpriority="high" decoding="async">
            <figcaption>ກຸ້ງເຜົາ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/cockles.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ຫອຍແຄງ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/fish-sauce-prawns.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ກຸ້ງແຊ່ນ້ຳປາ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/tomato-spaghetti.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ສະປາເກັດຕີ<wbr>ຊອດໝາກເລັ່ນ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/nam-khao.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ແໜມເຂົ້າ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/salt-prawns.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ກຸ້ງອົບເກືອ</figcaption>
          </figure>
          <figure>
            <img src="assets/menu/grilled-squid.webp" width="1050" height="700" alt="" loading="lazy" decoding="async">
            <figcaption>ປີ້ງປາມຶກ</figcaption>
          </figure>
      </div>
    </article>
  </main>
</body>
</html>
